name: AkkCards Smoke Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check server.js
      - run: node -e "const fs=require('fs'); const h=fs.readFileSync('index.html','utf8'); if(!h.includes('<title>AkkCards</title>')||!h.includes('new WebSocket')) process.exit(1); console.log('AkkCards frontend smoke check passed')"
